<style>
:root{--ups:#351c15;--gold:#ffb500}
*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#eee}
nav{background:var(--ups);display:flex;align-items:center;gap:6px;padding:0 12px;flex-wrap:wrap}
nav .brand{color:var(--gold);font-weight:800;font-size:14px;margin-right:14px;padding:12px 0;white-space:nowrap}
nav button{background:transparent;border:none;color:#fff;padding:13px 16px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{border-bottom-color:var(--gold);color:var(--gold);font-weight:700}
nav button:hover{color:var(--gold)}
main{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff}
@media print{nav{display:none}}
</style>
<base target="_blank">

<style id="resp">
/* ====== RESPONSIVE AUTO-RESIZE ====== */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
table thead,table tbody,table tr{display:table;width:100%;table-layout:auto}
.card,header{padding-left:12px;padding-right:12px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
@media(max-width:900px){
  header h1{font-size:17px}
  header small{font-size:11px}
}
@media(max-width:720px){
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
  .controls button{width:100%}
  .card{padding:12px;border-radius:8px}
  header h1{font-size:15px}
  .kpi .v{font-size:18px}
  .kpi.total .v{font-size:20px}
}
@media(max-width:480px){
  .controls{grid-template-columns:1fr}
  .controls select,.controls input{width:100%!important;min-width:0}
  .summary{grid-template-columns:1fr 1fr}
  .kpi.total{grid-column:1/-1}
  nav button{padding:11px 10px;font-size:12px}
  nav .brand{font-size:12px}
  td input,td select{width:64px!important}
}
@media print{
  table{display:table;overflow:visible;white-space:normal}
}
</style>
<style>
@media(max-width:640px){nav{gap:2px;padding:0 6px}nav button{padding:10px 8px;font-size:12px}}

const host = document.getElementById('host');
const iframes = SRC.map(src=>{
  const f=document.createElement('iframe');
  f.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox allow-modals allow-forms');
  f.style.display='none';
  host.appendChild(f);
  f.srcdoc=decodeURIComponent(escape(atob(src)));
  return f;
});
iframes[0].style.display='block';
function show(i,btn){
  iframes.forEach((f,k)=>f.style.display=k===i?'block':'none');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===btn));
}
</script>
