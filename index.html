const host = document.getElementById('host');
const iframes = SRC.map(src=>{
  const f=document.createElement('iframe');
  f.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox allow-modals allow-forms');
  f.style.display='none';
  host.appendChild(f);
  f.srcdoc=decodeURIComponent(escape(atob(src)));
  return f;
});
iframes[0].style.display='block';
function show(i,btn){
  iframes.forEach((f,k)=>f.style.display=k===i?'block':'none');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===btn));
}
</script>
